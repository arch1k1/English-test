<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#faf7f2;--card:#fff;--tx:#1b2438;--mut:#6b7385;--bd:#e3ddd0;--ac:#1b2438;--ok:#d9f2e0;--okb:#2e9b57;--bad:#fadcdc;--badb:#d04545}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--card:#1d222e;--tx:#eceef4;--mut:#9aa2b5;--bd:#2f3646;--ac:#c9a86a;--ok:#1d3b2a;--okb:#4cc17f;--bad:#472324;--badb:#ef6b6b}}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px}
.sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{flex:1 1 140px;padding:10px 8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.panel{display:none}.panel.on{display:block}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:2}
.score{font-weight:600}
.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--ac);background:var(--ac);color:var(--bg);cursor:pointer;font-size:14px}
.btn.ghost{background:transparent;color:var(--tx);border-color:var(--bd)}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.qt{font-weight:600;margin-bottom:8px}
.qt .n{color:var(--mut);font-weight:400;margin-right:6px}
.blank{display:inline-block;min-width:60px;border-bottom:2px solid var(--mut)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opts button{padding:10px;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:10px;font-size:15px;text-align:left;cursor:pointer}
.opts button.ok{background:var(--ok);border-color:var(--okb)}
.opts button.bad{background:var(--bad);border-color:var(--badb)}
.opts button:disabled{cursor:default}
.hint{color:var(--mut);font-size:13px}
input[type=text]{width:100%;margin-top:6px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
input.ok{background:var(--ok);border-color:var(--okb)}input.bad{background:var(--bad);border-color:var(--badb)}
.ans{font-size:13px;color:var(--badb);margin-top:4px}
.card{min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:26px;font-weight:600;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;cursor:pointer;margin-bottom:12px;user-select:none}
.card small{font-size:12px;color:var(--mut);font-weight:400;margin-bottom:8px;letter-spacing:.1em}
.row{display:flex;gap:8px;margin-bottom:14px}.row .btn{flex:1}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pg button{padding:12px 8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px;cursor:pointer}
.pg button.sel{border:2px solid var(--ac)}
.pg button.ok{background:var(--ok);border-color:var(--okb);opacity:.7}
.pg button.bad{background:var(--bad);border-color:var(--badb)}
</style>

nce"], ["___ the pancake.", "перевернуть", ["flip"], "flip"], ["___ the potatoes.", "сделать пюре", ["mash"], "mash"], ["___ the cream.", "взбить", ["whip"], "whip"], ["Heat the soup in a ___.", "ковш", ["saucepan"], "saucepan"], ["___ the oven to 180°C.", "разогреть заранее", ["preheat"], "preheat"], ["Read the ___ first.", "рецепт", ["recipe"], "recipe"], ["Cut the cake and give me a ___.", "ломтик", ["slice"], "slice"], ["Put the milk in the ___ to keep it cold.", "холодильник", ["fridge", "refrigerator"], "fridge"], ["I forgot the toast, and now it's ___.", "подгоревший", ["burnt"], "burnt"]];
const P=[["Прочитай рецепт перед началом.", "Read the recipe before you start.", ["Read the ingredients before you start.", "Read the oven before you start."]], ["Разогрей духовку до 180 градусов.", "Preheat the oven to 180°C.", ["Preheat the toaster to 180°C.", "Preheat the fridge to 180°C."]], ["Добавь одну чайную ложку соли.", "Add one teaspoon of salt.", ["Add one ladle of salt.", "Add one saucer of salt."]], ["Эта паста просто восхитительна!", "This pasta is absolutely delicious!", ["This pasta is absolutely burnt!", "This pasta is absolutely canned!"]], ["Тост подгорел.", "The toast is burnt.", ["The toast is diced.", "The toast is whipped."]], ["Аккуратно перемешайте салат.", "Gently toss the salad to combine.", ["Gently mince the salad to combine.", "Gently bake the salad to combine."]], ["Нарежь курицу небольшими кусочками.", "Cut the chicken into bite-size pieces.", ["Cut the chicken into canned pieces.", "Grate the chicken into burnt pieces."]], ["Дай курице остыть.", "Let the chicken cool.", ["Let the chicken flip.", "Let the chicken mash."]], ["Слей воду из консервированной кукурузы.", "Drain the canned corn.", ["Pour the diced corn.", "Drain the shredded corn."]], ["Просей муку и замеси тесто.", "Sift the flour and knead the dough.", ["Mince the flour and whip the dough.", "Sift the flour and mash the dough."]], ["Я варю яйца и жарю сосиски.", "I boil eggs and fry sausages.", ["I bake eggs and whip sausages.", "I grate eggs and slice sausages into water."]], ["Она в фартуке и с половником в руке.", "She is wearing an apron and holding a ladle.", ["She is wearing a napkin and holding a saucer.", "She is wearing a mug and holding a toothpick."]], ["Мы едим суши палочками.", "We eat sushi with chopsticks.", ["We eat sushi with toothpicks.", "We eat sushi with ladles."]], ["Положи сыр сверху и подавай сразу.", "Top it with cheese and serve immediately.", ["Beat it with cheese and serve immediately.", "Smoke it with cheese and serve immediately."]], ["Рецеп const ALT={"refrigerator / fridge": ["refrigerator", "fridge"], "breadbox / breadbasket": ["breadbox", "breadbasket"], "cup / mug": ["cup", "mug"], "microwave oven": ["microwave"], "frying pan": ["frying-pan"], "coffee maker": ["coffee machine"], "shredded cheese": ["shredded", "grated cheese"], "bite-size": ["bite size", "bite-sized"], "a slice of bread": ["slice of bread", "a slice"], "Enjoy your meal!": ["enjoy your meal"], "gently toss to combine": ["toss gently to combine"], "cut into pieces": ["cut into pieces"], "chicken breast": ["chicken breasts"]};
let GR='all';const cur=()=>GR==='all'?W:W.filter(w=>w[2]===GR);
const WT=()=>cur().map(w=>[w[0],'переведи на английский',[w[1],...(ALT[w[1]]||[])],w[1]]);
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const norm=s=>s.toLowerCase().replace(/[-–]/g," ").replace(/[’`]/g,"'").replace(/\s+/g," ").trim();
const mk=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};

function wordQuiz(idx){ // idx 0: RU->EN, 1: EN->RU
  const from=idx?1:0,to=idx?0:1;
  return sh(cur()).map(w=>({q:w[from],ans:w[to],opts:sh([w[to],...sh(W.filter(x=>x[to]!==w[to])).slice(0,3).map(x=>x[to])])}));
}

function mcq(box,items){
  box.innerHTML="";let done=0,right=0;const wrong=[];
  const bar=mk("div","bar");const sc=mk("span","score","Верно: 0 / "+items.length);
  const rs=mk("button","btn ghost","Заново");bar.append(sc,rs);box.append(bar);
  rs.onclick=()=>box.dispatchEvent(new Event("reset"));
  items.forEach((it,i)=>{
    const q=mk("div","q");q.append(mk("div","qt",`<span class="n">${i+1}.</span>${it.q}`));
    const o=mk("div","opts");
    it.opts.forEach(t=>{
      const b=mk("button","",t);
      b.onclick=()=>{
        o.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.textContent===it.ans)x.classList.add("ok")});
        if(t===it.ans)right++;else{b.classList.add("bad");wrong.push(it)}
        done++;sc.textContent=`Верно: ${right} / ${items.length}`+(done===items.length?" — готово!":"");
        if(done===items.length&&wrong.length){
          const r=mk("button","btn","Повторить ошибки ("+wrong.length+")");r.style.marginBottom="20px";
          r.onclick=()=>{mcq(box,wrong.map(x=>({...x,opts:sh(x.opts)})));window.scrollTo(0,0)};box.append(r);
        }
      };o.append(b);
    });
    q.append(o);box.append(q);
  });
}

function typed(box,list){
  box.innerHTML="";const items=sh(list);const ins=[];
  const bar=mk("div","bar");const sc=mk("span","score","Впиши слово или фразу по-английски");
  const rs=mk("button","btn ghost","Заново");bar.append(sc,rs);box.append(bar);
  rs.onclick=()=>box.dispatchEvent(new Event("reset"));
  items.forEach((it,i)=>{
    const q=mk("div","q");
    q.append(mk("div","qt",`<span class="n">${i+1}.</span>${it[0].replace("___",'<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>')}`));
    q.append(mk("div","hint",it[1].split(" · ").pop()));
    const inp=mk("input");inp.type="text";inp.autocomplete="off";inp.autocapitalize="off";inp.spellcheck=false;
    const a=mk("div","ans");q.append(inp,a);box.append(q);ins.push([inp,a,it]);
  });
  const chk=mk("button","btn","Проверить всё");chk.style.marginBottom="20px";
  chk.onclick=()=>{
    let r=0;
    ins.forEach(([inp,a,it])=>{
      const ok=it[2].map(norm).includes(norm(inp.value));
      inp.className=ok?"ok":"bad";a.textContent=ok?"":"Правильно: "+(it[3]||it[2][0]);
      if(ok)r++;
    });
    sc.textContent=`Верно: ${r} / ${items.length}`;
  };
  box.append(chk);
}

function say(t){try{const u=new SpeechSynthesisUtterance(t.replace(/^to /,""));u.lang="en-GB";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

function cards(box){
  let deck=sh(cur()),i=0,flip=false,known=0,miss=[];
  const draw=()=>{
    box.innerHTML="";
    if(i>=deck.length){
      box.append(mk("div","q",`<div class="qt">Круг закончен. Знаю: ${known}, повторить: ${miss.length}</div>`));
      const row=mk("div","row");
      if(miss.length){const b=mk("button","btn","Повторить незнакомые");b.onclick=()=>{deck=sh(miss);miss=[];i=0;known=0;flip=false;draw()};row.append(b)}
      const r=mk("button","btn ghost","Все слова заново");r.onclick=()=>box.dispatchEvent(new Event("reset"));row.append(r);box.append(row);return;
    }
    const w=deck[i];
    box.append(mk("div","bar",`<span class="score">${i+1} / ${deck.length}</span><span class="hint">нажми на карточку, чтобы перевернуть</span>`));
    const c=mk("div","card",flip?`<small>EN</small>${w[1]}`:`<small>RU</small>${w[0]}`);
    c.onclick=()=>{flip=!flip;if(flip)say(w[1]);draw()};box.append(c);
    const row=mk("div","row");
    if(flip){
      const no=mk("button","btn ghost","Не знаю");no.onclick=()=>{miss.push(w);i++;flip=false;draw()};
      const yes=mk("button","btn","Знаю");yes.onclick=()=>{known++;i++;flip=false;draw()};
      const sp=mk("button","btn ghost","🔊");sp.style.flex="0 0 56px";sp.onclick=()=>say(w[1]);
      row.append(no,sp,yes);box.append(row);
    }
  };
  draw();
}

function pairs(box){
  const ws=sh(cur()),rounds=[];for(let k=0;k<ws.length;k+=6)rounds.push(ws.slice(k,k+6));
  let r=0,err=0;
  const draw=()=>{
    box.innerHTML="";
    if(r>=rounds.length){
      box.append(mk("div","q",`<div class="qt">Все пары собраны! Ошибок: ${err}</div>`));
      const b=mk("button","btn","Заново");b.onclick=()=>box.dispatchEvent(new Event("reset"));box.append(b);return;
    }
    const set=rounds[r];
    box.append(mk("div","bar",`<span class="score">Раунд ${r+1} / ${rounds.length}</span><span class="hint">ошибок: ${err}</span>`));
    const g=mk("div","pg");let sel=null,left=set.length;
    const L=sh(set).map(w=>{const b=mk("button","",w[0]);b.w=w;return b});
    const R=sh(set).map(w=>{const b=mk("button","",w[1]);b.w=w;return b});
    const lc=mk("div"),rc=mk("div");[lc,rc].forEach(c=>{c.style.display="grid";c.style.gap="8px"});
    L.forEach(b=>{b.onclick=()=>{if(b.classList.contains("ok"))return;L.forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=b}});
    R.forEach(b=>{b.onclick=()=>{
      if(b.classList.contains("ok")||!sel)return;
      if(sel.w===b.w){sel.className="ok";b.className="ok";sel=null;left--;if(left===0)setTimeout(()=>{r++;draw()},700)}
      else{err++;b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),400)}
    }});
    lc.append(...L);rc.append(...R);g.append(lc,rc);box.append(g);
  };
  draw();
}

const sentQuiz=()=>sh(S).map(s=>({q:s[0].replace("___",'<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>'),ans:s[1],opts:sh([s[1],...s[2]])}));
const transQuiz=()=>sh(P).map(p=>({q:p[0],ans:p[1],opts:sh([p[1],...p[2]])}));

const tabs=[
["🃏 Карточки",cards],
["🔗 Пары",pairs],
["RU → EN",b=>mcq(b,wordQuiz(0))],
["EN → RU",b=>mcq(b,wordQuiz(1))],
["Предложения: выбор",b=>mcq(b,sentQuiz())],
["Предложения: впиши",b=>typed(b,T)],
["Слово: впиши",b=>typed(b,WT())],
["Перевод фраз",b=>mcq(b,transQuiz())]
];
document.getElementById("gr").onchange=e=>{GR=e.target.value;document.querySelectorAll(".panel").forEach(p=>p.dispatchEvent(new Event("reset")))};
const tb=document.getElementById("tabs"),pn=document.getElementById("panels");
tabs.forEach(([name,fn],i)=>{
  const b=mk("button",i?"":"on",name),p=mk("div","panel"+(i?"":" on"));
  const render=()=>fn(p);p.addEventListener("reset",render);render();
  b.onclick=()=>{tb.querySelectorAll("button").forEach(x=>x.classList.remove("on"));pn.querySelectorAll(".panel").forEach(x=>x.classList.remove("on"));b.classList.add("on");p.classList.add("on");window.scrollTo(0,0)};
  tb.append(b);pn.append(p);
});
</script>
